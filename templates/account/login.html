{% extends "lancamentos/base.html" %}
{% load socialaccount %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
    <div class="painel form-caixa auth">
        <h2>Entrar</h2>

        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            {{ redirect_field }}
            <div class="botoes">
                <button type="submit">Entrar</button>
            </div>
        </form>

        <div class="divisor">ou</div>

        <form method="post" action="{% provider_login_url 'google' process='login' %}">
            {% csrf_token %}
            <button type="submit" class="btn-google">Continuar com o Google</button>
        </form>

        <p class="suave">Ainda não tem conta? <a href="{% url 'account_signup' %}">Criar conta</a></p>
    </div>
{% endblock %}
