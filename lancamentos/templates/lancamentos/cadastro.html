{% extends "lancamentos/base.html" %}

{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
    <div class="painel form-caixa">
        <h2>Criar conta</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="botoes">
                <button class="btn" type="submit">Criar conta</button>
            </div>
        </form>
        <p class="suave">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </div>
{% endblock %}
