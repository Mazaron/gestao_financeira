{% extends "lancamentos/base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
    <div class="painel form-caixa">
        <h2>Entrar</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="botoes">
                <button class="btn" type="submit">Entrar</button>
            </div>
        </form>
        <p class="suave">Ainda não tem conta? <a href="{% url 'cadastro' %}">Criar conta</a></p>
    </div>
{% endblock %}
