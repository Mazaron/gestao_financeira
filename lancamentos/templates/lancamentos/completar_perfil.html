{% extends "lancamentos/base.html" %}
{% load static %}

{% block titulo %}Completar cadastro{% endblock %}

{% block conteudo %}
    <div class="painel form-caixa">
        <h2>Complete seu cadastro</h2>
        <p class="suave">Precisamos de mais algumas informações para continuar.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="botoes">
                <button class="btn" type="submit">Salvar</button>
            </div>
        </form>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'lancamentos/mascaras.js' %}"></script>
{% endblock %}
